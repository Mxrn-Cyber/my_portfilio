<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Mxrn Cyber — Lao Thomorn, full-stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c6ff3d" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
    <style>
      .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: Menlo, Consolas, "SFMono-Regular", monospace; }
      .cur { animation: b 1.1s steps(1) infinite; }
      @keyframes b { 50% { opacity: 0; } }
      .float { animation: f 5s ease-in-out infinite; }
      @keyframes f { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0a0a0a"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glowR)"/>
    <rect width="1280" height="400" fill="url(#fadeL)"/>

    <!-- terminal chip -->
    <g transform="translate(72 70)">
      <rect width="196" height="36" rx="18" fill="#141414" stroke="#c6ff3d" stroke-opacity="0.45"/>
      <circle cx="20" cy="18" r="5" fill="#c6ff3d"/>
      <text x="36" y="23" class="m" font-size="15" fill="#a3a39b">$ whoami</text>
      <rect x="114" y="10" width="9" height="16" fill="#c6ff3d" class="cur"/>
    </g>

    <text x="68" y="190" class="t" font-size="92" font-weight="800" letter-spacing="-3" fill="#f5f5f0">MXRN <tspan fill="#c6ff3d">CYBER</tspan></text>
    <rect x="72" y="214" width="96" height="6" rx="3" fill="#c6ff3d"/>
    <text x="72" y="262" class="t" font-size="26" font-weight="600" fill="#f5f5f0">Lao Thomorn — Full-Stack Web Developer</text>
    <text x="72" y="298" class="t" font-size="20" fill="#a3a39b">UI/UX Designer  ·  ICT Teacher  ·  Cybersecurity learner</text>
    <text x="72" y="346" class="m" font-size="16" fill="#c6ff3d">react · node · laravel · fastapi · figma</text>

    <!-- avatar -->
    <g class="float">
      <svg x="860" y="20" width="390" height="380" viewBox="0 0 900 877" overflow="visible">
  <defs>
    <linearGradient id="av-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="av-hoodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="0.5" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="av-opening" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="av-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="0.65" stop-color="#1a1d14"/>
      <stop offset="1" stop-color="#2b3a12"/>
    </linearGradient>
    <linearGradient id="av-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ff9a"/>
      <stop offset="0.5" stop-color="#c6ff3d"/>
      <stop offset="1" stop-color="#7fc200"/>
    </linearGradient>
    <radialGradient id="av-screenGlow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="av-glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="av-openingClip">
      <path d="M312 610 C286 452 318 246 450 222 C582 246 614 452 588 610 C540 650 360 650 312 610 Z"/>
    </clipPath>
    <clipPath id="av-lensClip">
      <rect x="352" y="366" width="90" height="58" rx="16"/>
      <rect x="458" y="366" width="90" height="58" rx="16"/>
    </clipPath>
    <style>
      .code { animation: scroll 2.4s linear infinite; }
      @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-48px); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 450px 395px; }
      @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- shoulders / hoodie body -->
  <path d="M60 877 C70 715 190 630 330 606 L570 606 C710 630 830 715 840 877 Z" fill="url(#av-hoodie)"/>
  <path d="M60 877 C70 715 190 630 330 606 M570 606 C710 630 830 715 840 877" fill="none" stroke="#c6ff3d" stroke-opacity="0.55" stroke-width="3"/>
  <!-- center seam + pocket hint -->
  <path d="M450 690 L450 877" stroke="#000" stroke-opacity="0.5" stroke-width="4"/>
  <path d="M300 877 C320 820 360 800 450 800 C540 800 580 820 600 877" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4"/>

  <!-- hood -->
  <path d="M240 655 C198 470 228 168 450 108 C672 168 702 470 660 655 C602 700 298 700 240 655 Z" fill="url(#av-hoodSide)"/>
  <path d="M240 655 C198 470 228 168 450 108 C672 168 702 470 660 655" fill="none" stroke="#c6ff3d" stroke-opacity="0.7" stroke-width="3"/>
  <!-- hood fold lines -->
  <path d="M290 520 C280 400 310 260 400 190" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="5"/>
  <path d="M610 520 C620 400 590 260 500 190" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="5"/>
  <!-- hood opening -->
  <path d="M312 610 C286 452 318 246 450 222 C582 246 614 452 588 610 C540 650 360 650 312 610 Z" fill="url(#av-opening)"/>

  <!-- face in shadow, under-lit by a screen -->
  <path d="M362 335 C360 272 540 272 538 335 L533 468 C524 544 482 588 450 591 C418 588 376 544 367 468 Z" fill="url(#av-face)"/>
  <ellipse cx="450" cy="640" rx="160" ry="110" fill="url(#av-screenGlow)" clip-path="url(#av-openingClip)"/>

  <!-- glasses -->
  <g filter="url(#av-glow)" class="pulse">
    <rect x="352" y="366" width="90" height="58" rx="16" fill="url(#av-lens)"/>
    <rect x="458" y="366" width="90" height="58" rx="16" fill="url(#av-lens)"/>
    <path d="M442 390 L458 390" stroke="#c6ff3d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- code scrolling inside the lenses -->
  <g clip-path="url(#av-lensClip)">
    <g class="code" fill="#0a0a0a" fill-opacity="0.55">
      <rect x="362" y="376" width="44" height="5" rx="2"/><rect x="410" y="376" width="20" height="5" rx="2"/>
      <rect x="370" y="388" width="30" height="5" rx="2"/><rect x="404" y="388" width="28" height="5" rx="2"/>
      <rect x="362" y="400" width="56" height="5" rx="2"/>
      <rect x="370" y="412" width="22" height="5" rx="2"/><rect x="396" y="412" width="36" height="5" rx="2"/>
      <rect x="362" y="424" width="40" height="5" rx="2"/>
      <rect x="370" y="436" width="50" height="5" rx="2"/>
      <rect x="362" y="448" width="30" height="5" rx="2"/><rect x="396" y="448" width="22" height="5" rx="2"/>
      <rect x="370" y="460" width="44" height="5" rx="2"/>
      <rect x="468" y="376" width="30" height="5" rx="2"/><rect x="502" y="376" width="34" height="5" rx="2"/>
      <rect x="476" y="388" width="52" height="5" rx="2"/>
      <rect x="468" y="400" width="24" height="5" rx="2"/><rect x="496" y="400" width="30" height="5" rx="2"/>
      <rect x="476" y="412" width="40" height="5" rx="2"/>
      <rect x="468" y="424" width="58" height="5" rx="2"/>
      <rect x="476" y="436" width="28" height="5" rx="2"/><rect x="508" y="436" width="20" height="5" rx="2"/>
      <rect x="468" y="448" width="46" height="5" rx="2"/>
      <rect x="476" y="460" width="34" height="5" rx="2"/>
    </g>
  </g>
  <!-- lens shine -->
  <path d="M362 378 L384 372" stroke="#fff" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"/>
  <path d="M468 378 L490 372" stroke="#fff" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"/>

  <!-- smirk -->
  <path d="M424 522 Q452 536 482 514" fill="none" stroke="#3a4a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- drawstrings -->
  <path d="M398 640 C394 680 390 720 386 768" fill="none" stroke="#d6d6d6" stroke-width="7" stroke-linecap="round"/>
  <path d="M502 640 C506 680 510 720 514 768" fill="none" stroke="#d6d6d6" stroke-width="7" stroke-linecap="round"/>
  <rect x="378" y="762" width="16" height="26" rx="4" fill="#c6ff3d"/>
  <rect x="506" y="762" width="16" height="26" rx="4" fill="#c6ff3d"/>

  <!-- chest tag -->
  <text x="450" y="842" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#c6ff3d">&lt;/&gt;<tspan class="blink">_</tspan></text>
</svg>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="#c6ff3d" stroke-opacity="0.25"/>
</svg>
